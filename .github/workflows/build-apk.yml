name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # ✅ Pastikan Capacitor Android terinstall
      - name: Install Capacitor Android
        run: npm install @capacitor/android

      - name: Build Web
        run: npm run build || true

      - name: Init Capacitor (if not exists)
        run: npx cap init grbl-controller com.asem.grblcontroller --web-dir=dist || true

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      # ✅ Build APK DEBUG langsung
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
