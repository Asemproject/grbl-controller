name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      # Pastikan Capacitor Android terinstall
      - name: Install Capacitor Android
        run: npm install @capacitor/android

      - name: Build Web (Vite)
        run: npm run build --if-present

      - name: Init Capacitor (if not exists)
        run: npx cap init grbl-controller com.asem.grblcontroller --web-dir=dist || true

      - name: Add Android Platform (if not exists)
        run: npx cap add android || true

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      - name: Show Android SDK info (diagnostic)
        run: |
          echo "SDK dir listing:"
          ls -la /usr/local/lib/android || true
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager exists:"
            sdkmanager --list || true
          else
            echo "sdkmanager NOT in PATH"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
